  /v1.0/drives/{drive_id}/items/{item_id}/content:
    get:
      summary: Content
      description: 'A file''s content: 302 to a PRE-AUTHENTICATED URL.


        That''s what Graph returns, and it must be followed WITHOUT the Bearer --

        the URL carries its own authorization (`tempauth`), time-limited.'
      operationId: content_v1_0_drives__drive_id__items__item_id__content_get
      parameters:
      - name: drive_id
        in: path
        required: true
        schema:
          type: string
          title: Drive Id
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      responses:
