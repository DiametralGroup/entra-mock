            site'
        '404':
          description: '`itemNotFound`'
        '429':
          description: '`TooManyRequests` + `Retry-After` (injectable)'
        '302':
          description: 'Redirect to a PRE-AUTHENTICATED download URL (`Location`,
            short-lived `tempauth`). Follow it WITHOUT an Authorization header: the
            URL returns 401 if one is presented.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
