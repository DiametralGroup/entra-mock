  /v1.0/drives/{drive_id}/root:/{chemin}:
    get:
      summary: Par Chemin
      description: "L'adressage PAR CHEMIN, sous ses trois formes :\n\n• `root:/Insights360/NTE:/children`\
        \ — les enfants d'un dossier, PAGINÉS\n  (`@odata.nextLink`, `$skiptoken`\
        \ opaque), `$select` honoré ;\n• `root:/Insights360/NTE/balance_NTE_2026-01.xlsx`\
        \ (deux-points final\n  facultatif) — un élément ;\n• `root:/Insights360/NTE/balance_NTE_2026-01.xlsx:/content`\
        \ — 302 vers l'URL\n  de téléchargement.\n\nLa casse du chemin est indifférente,\
        \ comme dans SharePoint."
      operationId: par_chemin_v1_0_drives__drive_id__root___chemin__get
      parameters:
      - name: drive_id
        in: path
        required: true
        schema:
          type: string
          title: Drive Id
      - name: chemin
        in: path
        required: true
        schema:
          type: string
          title: Chemin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: '`InvalidAuthenticationToken` — Bearer absent, expiré, autre
            audience'
        '403':
          description: '`accessDenied` — aucun rôle `Sites.Selected` accordé sur le
            site'
        '404':
          description: '`itemNotFound`'
        '429':
          description: '`TooManyRequests` + `Retry-After` (injectable)'
        '302':
          description: 'Redirection vers une URL de téléchargement PRÉ-AUTHENTIFIÉE
            (`Location`, `tempauth` à durée limitée). À suivre SANS en-tête Authorization
            : l''URL rend 401 si on lui en présente un.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
