  /v1.0/drives/{drive_id}/root:/{path}:
    get:
      summary: By Path
      description: "PATH addressing, in its three forms:\n\n• `root:/reports:/children`\
        \ -- a folder's children, PAGINATED\n  (`@odata.nextLink`, opaque `$skiptoken`),\
        \ `$select` honoured;\n• `root:/reports/report-1.txt` (trailing colon optional)\
        \ -- an item;\n• `root:/reports/report-1.txt:/content` -- 302 to the download\
        \ URL.\n\nThe path's case is immaterial."
      operationId: by_path_v1_0_drives__drive_id__root___path__get
      parameters:
      - name: drive_id
        in: path
        required: true
        schema:
          type: string
          title: Drive Id
      - name: path
        in: path
        required: true
        schema:
          type: string
          title: Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: '`InvalidAuthenticationToken` -- Bearer missing, expired, wrong
            audience'
        '403':
          description: '`accessDenied` -- no `Sites.Selected` role granted on the
            site'
        '404':
          description: '`itemNotFound`'
        '429':
          description: '`TooManyRequests` + `Retry-After` (injectable)'
        '302':
          description: 'Redirect to a PRE-AUTHENTICATED download URL (`Location`,
            short-lived `tempauth`). Follow it WITHOUT an Authorization header: the
            URL returns 401 if one is presented.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
