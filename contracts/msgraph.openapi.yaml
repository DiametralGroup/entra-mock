openapi: 3.1.0
info:
  title: Microsoft Graph mock (Entra groups, SharePoint files)
  version: 0.5.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /{tenant}/oauth2/v2.0/token:
    post:
      summary: Token
      description: 'Flux client credentials — le vrai chemin d''authentification de
        Graph.


        Les quatre refus reproduisent des réponses OBSERVÉES le 2026-09-03 : statut,

        code OAuth2 et code AADSTS. Aucun n''est inventé.'
      operationId: token__tenant__oauth2_v2_0_token_post
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
          title: Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1.0/groups:
    get:
      summary: Groupes
      description: 'Les groupes, PAGINÉS — comme Graph, qui en sert 100 par page.


        Un client qui suivrait `@odata.nextLink` sur `/members` mais pas ici ne

        verrait que les `GROUPS_PAGE_SIZE` premiers groupes, sans la moindre erreur.'
      operationId: groupes_v1_0_groups_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1.0/groups/{group_id}/transitiveMembers:
    get:
      summary: Membres Transitifs
      description: 'L''appartenance EFFECTIVE, groupes imbriqués aplatis — comme Graph.


        Même enveloppe, même curseur opaque, même `$select` que `/members` : seule

        la composition de la collection change. C''est ce qui permet à un

        consommateur de basculer d''un chemin à l''autre sans réécrire sa pagination.'
      operationId: membres_transitifs_v1_0_groups__group_id__transitiveMembers_get
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1.0/groups/{group_id}/members:
    get:
      summary: Membres
      description: 'Membres d''un groupe, paginés par curseur opaque — comme Graph.


        Le curseur est ici l''index de départ encodé dans `@odata.nextLink`. Un

        pipeline qui ne suivrait pas ce lien ne verrait que les PAGE_SIZE premiers

        membres, sans la moindre erreur. C''est pourquoi la page est petite.


        Les membres ne sont PAS tous des personnes : `members` est déclaré

        `Collection(graph.directoryObject)` dans le CSDL officiel, et rend aussi

        bien un groupe imbriqué qu''un principal de service. Les deux sont sans UPN,

        et un consommateur doit les traiter différemment.'
      operationId: membres_v1_0_groups__group_id__members_get
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1.0/sites/{hostname}:/{server_relative_path}:
    get:
      summary: Site Par Chemin
      description: 'Le site par son CHEMIN — `/sites/{hôte}:/{chemin relatif au serveur}`.


        C''est l''adressage qu''un consommateur configure (un hôte et un chemin

        lisibles), et il en tire l''identifiant COMPOSITE du site pour la suite.

        Le deux-points final optionnel (`…:/sites/depot-finance:`) est accepté,

        comme chez Graph.'
      operationId: site_par_chemin_v1_0_sites__hostname____server_relative_path__get
      parameters:
      - name: hostname
        in: path
        required: true
        schema:
          type: string
          title: Hostname
      - name: server_relative_path
        in: path
        required: true
        schema:
          type: string
          title: Server Relative Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: '`InvalidAuthenticationToken` — Bearer absent, expiré, autre
            audience'
        '403':
          description: '`accessDenied` — aucun rôle `Sites.Selected` accordé sur le
            site'
        '404':
          description: '`itemNotFound`'
        '429':
          description: '`TooManyRequests` + `Retry-After` (injectable)'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
