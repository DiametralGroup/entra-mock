    get:
      summary: Contenu
      description: 'Le contenu d''un fichier : 302 vers une URL PRÉ-AUTHENTIFIÉE.


        C''est ce que Graph rend, et il faut le suivre SANS le Bearer — l''URL porte

        sa propre autorisation (`tempauth`), limitée dans le temps.'
      operationId: contenu_v1_0_drives__drive_id__items__item_id__content_get
