openapi: 3.1.0
info:
  title: Microsoft Graph mock (Entra groups, drive files)
  version: 0.5.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /{tenant}/oauth2/v2.0/token:
    post:
      summary: Token
      description: 'Client credentials flow -- Graph''s real authentication path.


        The four refusals reproduce responses OBSERVED on 2026-09-03: status,

        OAuth2 code and AADSTS code. None of it is invented.'
      operationId: token__tenant__oauth2_v2_0_token_post
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
          title: Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1.0/groups:
    get:
      summary: Groups
      description: 'The groups, PAGINATED -- like Graph, which serves 100 per page.


        A client following `@odata.nextLink` on `/members` but not here would see

        only the first `GROUPS_PAGE_SIZE` groups, without any error.'
      operationId: groups_v1_0_groups_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1.0/groups/{group_id}/transitiveMembers:
    get:
      summary: Transitive Members
      description: 'EFFECTIVE membership, nested groups flattened -- like Graph.


        Same envelope, same opaque cursor, same `$select` as `/members`: only the

        collection''s composition changes. That is what lets a consumer switch

        from one path to the other without rewriting its pagination.'
      operationId: transitive_members_v1_0_groups__group_id__transitiveMembers_get
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1.0/groups/{group_id}/members:
    get:
      summary: Members
      description: 'A group''s members, paginated by opaque cursor -- like Graph.


        The cursor here is the starting index encoded in `@odata.nextLink`. A

        pipeline that didn''t follow this link would see only the first PAGE_SIZE

        members, without any error.


        Members are NOT all people: `members` is declared

        `Collection(graph.directoryObject)` in the official CSDL, and returns a

        nested group as well as a service principal. Both lack a UPN, and a

        consumer must treat them differently.'
      operationId: members_v1_0_groups__group_id__members_get
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1.0/sites/{hostname}:/{server_relative_path}:
    get:
      summary: Site By Path
      description: 'The site by its PATH -- `/sites/{host}:/{server-relative path}`.


        That''s the addressing a client configures (a readable host and path),

        and it derives the site''s COMPOSITE identifier from it for the rest. The

        optional trailing colon (`…:/sites/documents:`) is accepted, as at Graph.'
      operationId: site_by_path_v1_0_sites__hostname____server_relative_path__get
      parameters:
      - name: hostname
        in: path
        required: true
        schema:
          type: string
          title: Hostname
      - name: server_relative_path
        in: path
        required: true
        schema:
          type: string
          title: Server Relative Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: '`InvalidAuthenticationToken` -- Bearer missing, expired, wrong
            audience'
        '403':
          description: '`accessDenied` -- no `Sites.Selected` role granted on the
            site'
        '404':
          description: '`itemNotFound`'
        '429':
          description: '`TooManyRequests` + `Retry-After` (injectable)'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1.0/sites/{site_id}:
    get:
      summary: Site
      description: The site by its composite identifier.
      operationId: site_v1_0_sites__site_id__get
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          title: Site Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
