[project]
name = "entra-mock"
version = "0.5.0"
description = "Microsoft Graph mock (Entra group membership, Graph files) — container image and installable Python package"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"

# Volontairement minimales, comme les trois autres mocks de l'écosystème.
# `python-multipart` n'est PAS accessoire : le flux client credentials de Graph
# poste un corps form-encoded, et sans lui FastAPI ne sait pas le lire. Un mock
# qui accepterait du JSON laisserait passer un client incapable de parler à la
# vraie API.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
]

[project.scripts]
entra-mock = "entra_mock.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entra_mock"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "ARG"]
ignore = ["PLR0913", "PLR2004", "PLC0415"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
pythonpath = ["."]
